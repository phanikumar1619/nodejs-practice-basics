<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Travel Gallery</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <h1 class="logo">Travelo ✈️</h1>
    <ul class="nav-links" id="navLinks">
      <li><a href="/">Home</a></li>
      <li><a href="#gallery">Gallery</a></li>
      <li><a href="/about">About</a></li>
      <li><a href="/contact">Contact</a></li>
    </ul>
    <button class="menu-btn" id="menuBtn">☰</button>
  </nav>

  <!-- HERO -->
  <header class="hero">
    <h2>Explore The World</h2>
    <p>Beautiful places, one photo at a time.</p>
  </header>

  <!-- GALLERY -->
  <section class="gallery" id="gallery">
    <div class="card"><img src="https://picsum.photos/seed/beach/400/300" alt="Beach" /><p>Beach</p></div>
    <div class="card"><img src="https://picsum.photos/seed/mountain/400/300" alt="Mountain" /><p>Mountain</p></div>
    <div class="card"><img src="https://picsum.photos/seed/city/400/300" alt="City" /><p>City</p></div>
    <div class="card"><img src="https://picsum.photos/seed/forest/400/300" alt="Forest" /><p>Forest</p></div>
    <div class="card"><img src="https://picsum.photos/seed/desert/400/300" alt="Desert" /><p>Desert</p></div>
    <div class="card"><img src="https://picsum.photos/seed/lake/400/300" alt="Lake" /><p>Lake</p></div>
  </section>

  <footer class="footer">
    <p>Made with ❤️ by Phani</p>
  </footer>

  <script src="/script.js"></script>
</body>
</html>
